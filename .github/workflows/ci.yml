name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / Node ${{ matrix.node }} / Vite ${{ matrix.vite }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22.12.0
            vite: 7
          - os: ubuntu-latest
            node: 24
            vite: 8
          - os: macos-latest
            node: 24
            vite: 8
          # Node 24.16+ can abort inside Windows filesystem watchers.
          # https://github.com/nodejs/node/issues/63638
          - os: windows-latest
            node: 24.15.0
            vite: 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - if: matrix.node != '22.12.0'
        run: pnpm lint
      - run: pnpm add --save-dev vite@^${{ matrix.vite }}
      - run: pnpm typecheck && pnpm test && pnpm test:examples && pnpm build

  theme-check:
    name: Shopify Theme Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:examples
      - run: npm install --global @shopify/cli@4.6.1
      - run: pnpm test:theme-check
